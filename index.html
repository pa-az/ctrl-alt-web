<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ctrl+Alt teaches you how apps manipulate you: 55 documented dark patterns and manipulation tactics, threat ratings for 29 platforms, and the brain science behind each one.">
  <meta name="theme-color" content="#141414">

  <!-- Social / link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ctrl+Alt">
  <meta property="og:title" content="Ctrl+Alt: See How Apps Manipulate You">
  <meta property="og:description" content="55 documented manipulation tactics, threat ratings for 29 platforms, and the brain science behind each one. Learn to catch yourself falling for them.">
  <meta property="og:url" content="https://ctrl-alt.app/">
  <meta property="og:image" content="https://ctrl-alt.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ctrl+Alt: See How Apps Manipulate You">
  <meta name="twitter:description" content="55 documented manipulation tactics, threat ratings for 29 platforms, and the brain science behind each one.">
  <meta name="twitter:image" content="https://ctrl-alt.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ctrl+Alt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ctrl+Alt: See How Apps Manipulate You</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body, html {
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: none;
      margin: 0;
      background: #141414;
    }
    /* Branded splash shown while the Flutter bundle loads. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #141414;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash svg {
      animation: splash-blink 1.6s linear infinite;
      transform-origin: center;
    }
    #splash p {
      color: #8a8a8a;
      font: 500 13px/1 system-ui, -apple-system, sans-serif;
      letter-spacing: 2px;
      margin: 0;
    }
    /* Blink EARLY in the cycle (~250ms in) so even fast loads catch it,
       then stay open for the rest. */
    @keyframes splash-blink {
      0%, 10%, 22%, 100% { transform: scaleY(1); }
      16% { transform: scaleY(0.05); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <!-- Same eye as the app logo (assets/app_icon.svg): coral almond, gold
         iris, dark pupil and a white reflection. -->
    <svg width="104" height="124" viewBox="28 12 144 176" xmlns="http://www.w3.org/2000/svg">
      <path d="M 35 100 Q 100 20 165 100 Q 100 180 35 100 Z" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="30" fill="#F0B429"/>
      <circle cx="100" cy="100" r="11" fill="#1A1A1A"/>
      <circle cx="103" cy="97" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    </svg>
    <p>CTRL+ALT</p>
  </div>
  <script>
    // Remove the splash once Flutter paints, and nudge the engine with a
    // resize: the first frame occasionally renders at a stale canvas size
    // until a relayout (long-standing engine quirk).
    window.addEventListener('flutter-first-frame', function () {
      setTimeout(function () {
        window.dispatchEvent(new Event('resize'));
        var s = document.getElementById('splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function () { s.remove(); }, 400);
        }
      }, 60);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Privacy-respecting analytics: GoatCounter is cookieless and open
       source, so no consent banner is needed. Counts page views only. -->
  <script>
    (function() {
      // Visiting https://ctrl-alt.app/#toggle-goatcounter once on a device
      // toggles counting off (or back on) for that browser. Use it on your
      // own machines so your visits don't pollute the stats.
      if (window.location.hash === '#toggle-goatcounter') {
        if (localStorage.getItem('skipgc') === 't') {
          localStorage.removeItem('skipgc');
          alert('GoatCounter tracking is now ENABLED in this browser.');
        } else {
          localStorage.setItem('skipgc', 't');
          alert('GoatCounter tracking is now DISABLED in this browser.');
        }
      }
      // Never count localhost / preview / dev builds, or opted-out browsers.
      if (window.location.host !== 'ctrl-alt.app' ||
          localStorage.getItem('skipgc') === 't') {
        window.goatcounter = { no_onload: true };
      }
    })();
  </script>
  <script data-goatcounter="https://paaz.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
