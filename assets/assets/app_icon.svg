<svg width="1024" height="1024" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background:#0a0a0e;">
  <defs>
    <radialGradient id="coingrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#FFE07A"/>
      <stop offset="40%"  stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#B97B10"/>
    </radialGradient>
    <radialGradient id="coininner" cx="45%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#FFD45E"/>
      <stop offset="100%" stop-color="#C98A14"/>
    </radialGradient>
    <radialGradient id="dotgrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </radialGradient>
  </defs>

  <!-- App icon background -->
  <rect width="200" height="200" rx="45" fill="#060A0F"/>

  <!-- Gold coin -->
  <circle cx="100" cy="100" r="65" fill="url(#coingrad)"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#B97B10" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#FFE07A" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="50" fill="url(#coininner)" opacity="0.6"/>

  <!-- Red dot pupil -->
  <circle cx="100" cy="100" r="25" fill="url(#dotgrad)"/>
  <!-- White specular at 45 degrees top-right -->
  <circle cx="110" cy="90" r="6" fill="#fff" opacity="0.55"/>

  <!-- Eye shape — pill (Front layer) -->
  <rect x="30" y="55" width="140" height="90" rx="45" fill="none" stroke="url(#dotgrad)" stroke-width="7"/>

</svg>
