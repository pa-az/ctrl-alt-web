<svg width="1024" height="1024" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="background:#F3F4F6;">
  <!-- App icon background (White/light grey) -->
  <rect width="200" height="200" rx="45" fill="#F3F4F6"/>

  <g transform="translate(100, 100) scale(1.35) translate(-100, -100)">
    <!-- Eye shape (Red outline) -->
    <path d="M 35 100 Q 100 20 165 100 Q 100 180 35 100 Z" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>

    <!-- Gold circle -->
    <circle cx="100" cy="100" r="30" fill="#F0B429"/>

    <!-- Pupil -->
    <circle cx="100" cy="100" r="11" fill="#000000"/>

    <!-- Reflection -->
    <circle cx="103" cy="97" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
